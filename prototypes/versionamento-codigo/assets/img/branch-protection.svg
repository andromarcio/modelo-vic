<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-label="Proteção de branches permanentes: push direto bloqueado, integração apenas via pull request">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .lbl { font-size: 11px; font-weight: 700; }
    .cap { font-size: 12px; fill: #525f66; }
    .bx  { font-size: 12.5px; font-weight: 700; fill: #22292e; }
  </style>
  <defs>
    <marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#127527"/></marker>
  </defs>

  <!-- branches permanentes -->
  <line x1="150" y1="80"  x2="880" y2="80"  stroke="#00437a" stroke-width="3"/>
  <line x1="150" y1="200" x2="880" y2="200" stroke="#005ca9" stroke-width="3"/>
  <text x="150" y="70"  class="lbl" fill="#00437a">main</text>
  <text x="150" y="220" class="lbl" fill="#005ca9">develop</text>

  <!-- cadeados de proteção -->
  <g transform="translate(78,68)"><rect x="0" y="6" width="26" height="20" rx="3" fill="#00437a"/><path d="M4 6 V3 a9 9 0 0 1 18 0 V6" fill="none" stroke="#00437a" stroke-width="3"/><circle cx="13" cy="15" r="2.4" fill="#fff"/></g>
  <g transform="translate(78,188)"><rect x="0" y="6" width="26" height="20" rx="3" fill="#005ca9"/><path d="M4 6 V3 a9 9 0 0 1 18 0 V6" fill="none" stroke="#005ca9" stroke-width="3"/><circle cx="13" cy="15" r="2.4" fill="#fff"/></g>

  <!-- push direto: bloqueado -->
  <text x="300" y="26" class="lbl" fill="#b22c2c" text-anchor="middle">push direto</text>
  <path d="M300 36 V70" fill="none" stroke="#d93636" stroke-width="2.2" stroke-dasharray="6 4"/>
  <g transform="translate(300,56)"><circle r="13" fill="#fbebeb" stroke="#d93636" stroke-width="2"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#d93636" stroke-width="2.2" stroke-linecap="round"/></g>
  <text x="300" y="92" class="cap" fill="#b22c2c" text-anchor="middle" font-weight="700" font-size="11">bloqueado</text>

  <!-- PR: permitido -->
  <rect x="470" y="120" width="262" height="50" rx="12" fill="#fff" stroke="#005ca9" stroke-width="1.8"/>
  <text class="bx" x="601" y="142" text-anchor="middle">Pull Request revisado e aprovado</text>
  <text class="cap" x="601" y="160" text-anchor="middle" font-size="11">concluído (merge) pelo Integrador</text>
  <path d="M601 120 V92" fill="none" stroke="#127527" stroke-width="2.4" marker-end="url(#bg)"/>
  <g transform="translate(635,104)"><circle r="11" fill="#e7f4ea" stroke="#127527" stroke-width="1.6"/><path d="M-5 0 l4 4 7 -8" fill="none" stroke="#127527" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="660" y="100" class="cap" fill="#0d581d" font-weight="700" font-size="11">merge permitido</text>

  <!-- pipeline chip -->
  <rect x="770" y="56" width="118" height="22" rx="11" fill="#e5f5f8" stroke="#b6e4ec"/><text x="829" y="71" font-size="10.5" font-weight="700" fill="#026273" text-anchor="middle">CI: testes + qualidade</text>

  <text x="460" y="232" class="cap" text-anchor="middle">Alterações nas branches permanentes ocorrem somente por pull request revisado, aprovado e concluído pelo Integrador.</text>
</svg>
