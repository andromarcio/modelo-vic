<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-label="Sincronização merge back de release e hotfix para main e develop">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .lbl { font-size: 11px; font-weight: 700; }
    .cap { font-size: 12px; fill: #525f66; }
    .tag { font-size: 10.5px; font-weight: 700; fill: #00437a; }
  </style>
  <defs>
    <marker id="m-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f39200"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d93636"/></marker>
    <marker id="m-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#005ca9"/></marker>
  </defs>

  <!-- lanes -->
  <line x1="60" y1="70"  x2="880" y2="70"  stroke="#00437a" stroke-width="3"/>
  <line x1="60" y1="250" x2="880" y2="250" stroke="#005ca9" stroke-width="3"/>
  <text x="60" y="60"  class="lbl" fill="#00437a">main</text>
  <text x="60" y="270" class="lbl" fill="#005ca9">develop</text>

  <!-- temporary segments -->
  <line x1="210" y1="160" x2="330" y2="160" stroke="#f39200" stroke-width="3"/>
  <text x="210" y="150" class="lbl" fill="#e58500">release/2.0.0</text>
  <line x1="590" y1="160" x2="700" y2="160" stroke="#d93636" stroke-width="3"/>
  <text x="590" y="150" class="lbl" fill="#d93636">hotfix/2.0.1</text>

  <!-- release flows -->
  <path d="M180 250 C195 250,195 160,212 160" fill="none" stroke="#f39200" stroke-width="2.4" marker-end="url(#m-orange)"/>
  <path d="M330 160 C348 160,348 70,366 70"   fill="none" stroke="#f39200" stroke-width="2.4" marker-end="url(#m-orange)"/>
  <path d="M330 160 C348 160,348 250,366 250" fill="none" stroke="#005ca9" stroke-width="3.4" marker-end="url(#m-back)"/>

  <!-- hotfix flows -->
  <path d="M560 70 C575 70,575 160,592 160"   fill="none" stroke="#d93636" stroke-width="2.4" marker-end="url(#m-red)"/>
  <path d="M700 160 C718 160,718 70,736 70"   fill="none" stroke="#d93636" stroke-width="2.4" marker-end="url(#m-red)"/>
  <path d="M700 160 C718 160,718 250,736 250" fill="none" stroke="#005ca9" stroke-width="3.4" marker-end="url(#m-back)"/>

  <!-- commits -->
  <g fill="#00437a"><circle cx="100" cy="70" r="6.5"/><circle cx="366" cy="70" r="6.5"/><circle cx="560" cy="70" r="6.5"/><circle cx="736" cy="70" r="6.5"/><circle cx="850" cy="70" r="6.5"/></g>
  <g fill="#005ca9"><circle cx="120" cy="250" r="6.5"/><circle cx="180" cy="250" r="6.5"/><circle cx="366" cy="250" r="6.5"/><circle cx="736" cy="250" r="6.5"/><circle cx="850" cy="250" r="6.5"/></g>
  <g fill="#f39200"><circle cx="250" cy="160" r="6"/><circle cx="300" cy="160" r="6"/></g>
  <g fill="#d93636"><circle cx="645" cy="160" r="6"/></g>

  <!-- tags -->
  <rect x="338" y="44" width="56" height="18" rx="5" fill="#fff" stroke="#00437a"/><text class="tag" x="366" y="57" text-anchor="middle">v2.0.0</text>
  <rect x="708" y="44" width="56" height="18" rx="5" fill="#fff" stroke="#00437a"/><text class="tag" x="736" y="57" text-anchor="middle">v2.0.1</text>

  <!-- merge back callouts -->
  <g>
    <rect x="392" y="150" width="120" height="24" rx="12" fill="#005ca9"/>
    <text x="452" y="167" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">↩ merge back</text>
  </g>
  <text class="cap" x="452" y="300" text-anchor="middle">Toda release e todo hotfix retornam para a develop ao final do ciclo — antes do próximo ciclo iniciar.</text>
</svg>
