<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 636" role="img" aria-label="Estrutura do Capítulo VIC: Integradores Lead e Integradores subordinados ao capítulo e alocados nas Comunidades; Membros do Capítulo atuam somente no nível do capítulo">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .ttl   { font-size: 26px; font-weight: 700; fill: #ffffff; letter-spacing: .5px; }
    .sub   { font-size: 13px; fill: #ffffff; fill-opacity: .88; }
    .sub2  { font-size: 11px; fill: #ffffff; fill-opacity: .66; letter-spacing: .4px; }
    .mtit  { font-size: 14.5px; font-weight: 700; fill: #ffffff; }
    .msub  { font-size: 10.5px; fill: #ffffff; fill-opacity: .82; }
    .chip  { font-size: 9.5px; font-weight: 600; fill: #ffffff; }
    .lead  { font-size: 15.5px; font-weight: 700; fill: #ffffff; }
    .intg  { font-size: 12px; font-weight: 600; fill: #00437a; }
    .cmt   { font-size: 14px; font-weight: 700; fill: #00437a; }
    .cmd   { font-size: 10px; fill: #7c93a8; }
    .lyr   { font-size: 10.5px; font-weight: 700; fill: #6d8ba5; letter-spacing: 2px; }
    .lgd   { font-size: 12px; fill: #475569; }
  </style>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00437a"/>
      <stop offset=".55" stop-color="#005ca9"/>
      <stop offset="1" stop-color="#0070cc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".88" cy="0" r=".8">
      <stop offset="0" stop-color="#f39200" stop-opacity=".38"/>
      <stop offset="1" stop-color="#f39200" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ══ CAPÍTULO (camada de governança) ══ -->
  <rect x="24" y="16" width="912" height="132" rx="18" fill="url(#band)"/>
  <rect x="24" y="16" width="912" height="132" rx="18" fill="url(#glow)"/>

  <!-- marca VIC -->
  <rect x="52" y="46" width="56" height="56" rx="14" fill="#ffffff"/>
  <g transform="translate(54.8,46.175) scale(0.42)">
    <g fill="none" stroke="#00437a" stroke-width="6.5" stroke-linecap="round">
      <path d="M39 36 C39 56, 60 52, 60 66"/>
      <path d="M81 36 C81 56, 60 52, 60 66"/>
      <path d="M60 66 V76"/>
    </g>
    <circle cx="39" cy="36" r="8.5" fill="#f39200"/>
    <circle cx="81" cy="36" r="8.5" fill="#21caaf"/>
    <circle cx="60" cy="66" r="7.5" fill="#00437a"/>
    <path d="M60 76 L45 84 V100 a5 5 0 0 0 5 5 H70 a5 5 0 0 0 5 -5 V84 Z" fill="#f39200"/>
    <circle cx="60" cy="91" r="3.4" fill="#ffffff"/>
  </g>

  <text class="ttl"  x="124" y="62">CAPÍTULO VIC</text>
  <text class="sub"  x="124" y="85">Versionamento e Integração de Código</text>
  <text class="sub2" x="124" y="104">MODELO DE DESENVOLVIMENTO CAIXA</text>

  <!-- Membros do Capítulo: atuam somente neste nível -->
  <rect x="556" y="32" width="356" height="98" rx="13" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".34" stroke-width="1.4"/>
  <text class="mtit" x="576" y="56">Membros do Capítulo</text>
  <text class="msub" x="576" y="76">Atuação exclusiva no nível do capítulo</text>
  <g fill="#ffffff" fill-opacity=".2">
    <rect x="576" y="92" width="68" height="20" rx="10"/>
    <rect x="652" y="92" width="73" height="20" rx="10"/>
    <rect x="733" y="92" width="52" height="20" rx="10"/>
    <rect x="793" y="92" width="57" height="20" rx="10"/>
  </g>
  <g class="chip" text-anchor="middle">
    <text x="610"   y="106">Processos</text>
    <text x="688.5" y="106">Diretrizes</text>
    <text x="759"   y="106">Normas</text>
    <text x="821.5" y="106">Padrões</text>
  </g>

  <!-- ══ subordinação: capítulo → leads ══ -->
  <g fill="none" stroke="#005ca9" stroke-width="2.2" stroke-linecap="round">
    <path d="M480 148 V176"/>
    <path d="M280 176 H680"/>
    <path d="M280 176 V204"/>
    <path d="M680 176 V204"/>
  </g>

  <!-- ══ INTEGRADOR LEAD ══ -->
  <g>
    <rect x="155" y="204" width="250" height="60" rx="14" fill="#005ca9"/>
    <circle cx="218" cy="230" r="5.5" fill="#ffffff"/>
    <path d="M209 243 a9 9 0 0 1 18 0 z" fill="#ffffff"/>
    <text class="lead" x="241" y="240">Integrador Lead</text>
  </g>
  <g>
    <rect x="555" y="204" width="250" height="60" rx="14" fill="#005ca9"/>
    <circle cx="618" cy="230" r="5.5" fill="#ffffff"/>
    <path d="M609 243 a9 9 0 0 1 18 0 z" fill="#ffffff"/>
    <text class="lead" x="641" y="240">Integrador Lead</text>
  </g>

  <!-- ══ subordinação: lead → conjunto de integradores ══ -->
  <g fill="none" stroke="#005ca9" stroke-width="2.2" stroke-linecap="round">
    <path d="M280 264 V292"/>
    <path d="M154 292 H406"/>
    <path d="M154 292 V320"/>
    <path d="M280 292 V320"/>
    <path d="M406 292 V320"/>

    <path d="M680 264 V292"/>
    <path d="M554 292 H806"/>
    <path d="M554 292 V320"/>
    <path d="M680 292 V320"/>
    <path d="M806 292 V320"/>
  </g>

  <!-- ══ INTEGRADORES ══ -->
  <g>
    <rect x="98" y="320" width="112" height="82" rx="14" fill="#ffffff" stroke="#cfe3f5" stroke-width="1.5"/>
    <circle cx="154" cy="350" r="19" fill="#e8f3fd"/>
    <circle cx="154" cy="346" r="5.5" fill="#00437a"/>
    <path d="M145 359 a9 9 0 0 1 18 0 z" fill="#00437a"/>
    <text class="intg" x="154" y="384" text-anchor="middle">Integrador</text>
  </g>
  <g>
    <rect x="224" y="320" width="112" height="82" rx="14" fill="#ffffff" stroke="#cfe3f5" stroke-width="1.5"/>
    <circle cx="280" cy="350" r="19" fill="#e8f3fd"/>
    <circle cx="280" cy="346" r="5.5" fill="#00437a"/>
    <path d="M271 359 a9 9 0 0 1 18 0 z" fill="#00437a"/>
    <text class="intg" x="280" y="384" text-anchor="middle">Integrador</text>
  </g>
  <g>
    <rect x="350" y="320" width="112" height="82" rx="14" fill="#ffffff" stroke="#cfe3f5" stroke-width="1.5"/>
    <circle cx="406" cy="350" r="19" fill="#e8f3fd"/>
    <circle cx="406" cy="346" r="5.5" fill="#00437a"/>
    <path d="M397 359 a9 9 0 0 1 18 0 z" fill="#00437a"/>
    <text class="intg" x="406" y="384" text-anchor="middle">Integrador</text>
  </g>
  <g>
    <rect x="498" y="320" width="112" height="82" rx="14" fill="#ffffff" stroke="#cfe3f5" stroke-width="1.5"/>
    <circle cx="554" cy="350" r="19" fill="#e8f3fd"/>
    <circle cx="554" cy="346" r="5.5" fill="#00437a"/>
    <path d="M545 359 a9 9 0 0 1 18 0 z" fill="#00437a"/>
    <text class="intg" x="554" y="384" text-anchor="middle">Integrador</text>
  </g>
  <g>
    <rect x="624" y="320" width="112" height="82" rx="14" fill="#ffffff" stroke="#cfe3f5" stroke-width="1.5"/>
    <circle cx="680" cy="350" r="19" fill="#e8f3fd"/>
    <circle cx="680" cy="346" r="5.5" fill="#00437a"/>
    <path d="M671 359 a9 9 0 0 1 18 0 z" fill="#00437a"/>
    <text class="intg" x="680" y="384" text-anchor="middle">Integrador</text>
  </g>
  <g>
    <rect x="750" y="320" width="112" height="82" rx="14" fill="#ffffff" stroke="#cfe3f5" stroke-width="1.5"/>
    <circle cx="806" cy="350" r="19" fill="#e8f3fd"/>
    <circle cx="806" cy="346" r="5.5" fill="#00437a"/>
    <path d="M797 359 a9 9 0 0 1 18 0 z" fill="#00437a"/>
    <text class="intg" x="806" y="384" text-anchor="middle">Integrador</text>
  </g>

  <!-- ══ alocação: integradores → comunidades ══ -->
  <g fill="none" stroke="#8aa6bd" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round">
    <path d="M154 402 V436"/><path d="M280 402 V436"/>
    <path d="M154 436 H280"/><path d="M217 436 V488"/>

    <path d="M406 402 V436"/><path d="M554 402 V436"/>
    <path d="M406 436 H554"/><path d="M480 436 V488"/>

    <path d="M680 402 V436"/><path d="M806 402 V436"/>
    <path d="M680 436 H806"/><path d="M743 436 V488"/>
  </g>

  <!-- ══ COMUNIDADES (camada de atuação) ══ -->
  <rect x="24" y="452" width="912" height="116" rx="18" fill="#f0f7fd" stroke="#c3ddf3" stroke-width="1.5"/>
  <text class="lyr" x="44" y="474">COMUNIDADES</text>

  <g>
    <rect x="117" y="488" width="200" height="64" rx="13" fill="#ffffff" stroke="#cfe3f5" stroke-width="1.5"/>
    <circle cx="149" cy="513" r="4.5" fill="#f39200"/>
    <circle cx="165" cy="513" r="4.5" fill="#21caaf"/>
    <circle cx="157" cy="528" r="5" fill="#005ca9"/>
    <text class="cmt" x="185" y="516">Comunidade A</text>
    <text class="cmd" x="185" y="534">Integradores alocados</text>
  </g>
  <g>
    <rect x="380" y="488" width="200" height="64" rx="13" fill="#ffffff" stroke="#cfe3f5" stroke-width="1.5"/>
    <circle cx="412" cy="513" r="4.5" fill="#f39200"/>
    <circle cx="428" cy="513" r="4.5" fill="#21caaf"/>
    <circle cx="420" cy="528" r="5" fill="#005ca9"/>
    <text class="cmt" x="448" y="516">Comunidade B</text>
    <text class="cmd" x="448" y="534">Integradores alocados</text>
  </g>
  <g>
    <rect x="643" y="488" width="200" height="64" rx="13" fill="#ffffff" stroke="#cfe3f5" stroke-width="1.5"/>
    <circle cx="675" cy="513" r="4.5" fill="#f39200"/>
    <circle cx="691" cy="513" r="4.5" fill="#21caaf"/>
    <circle cx="683" cy="528" r="5" fill="#005ca9"/>
    <text class="cmt" x="711" y="516">Comunidade C</text>
    <text class="cmd" x="711" y="534">Integradores alocados</text>
  </g>

  <!-- ══ legenda ══ -->
  <g>
    <path d="M26 598 H58" fill="none" stroke="#005ca9" stroke-width="2.4" stroke-linecap="round"/>
    <text class="lgd" x="66" y="602">Subordinação — todos respondem ao Capítulo</text>

    <path d="M420 598 H452" fill="none" stroke="#8aa6bd" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round"/>
    <text class="lgd" x="460" y="602">Alocação — atuação do Integrador na Comunidade</text>
  </g>
</svg>
