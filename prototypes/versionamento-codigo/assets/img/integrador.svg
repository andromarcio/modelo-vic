<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-label="Papel do Integrador como guardião dos guard-rails de promoção e suas responsabilidades">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .bx  { font-size: 13px; font-weight: 700; fill: #22292e; }
    .cap { font-size: 12px; fill: #525f66; }
    .ct  { font-size: 13px; font-weight: 700; fill: #00437a; }
    .cd  { font-size: 11.5px; fill: #525f66; }
  </style>
  <defs>
    <marker id="i-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9eb2b8"/></marker>
    <marker id="i-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#127527"/></marker>
  </defs>

  <!-- pipeline boxes -->
  <g>
    <rect x="18"  y="78" width="120" height="46" rx="10" fill="#fff" stroke="#21caaf" stroke-width="2"/><text class="bx" x="78"  y="106" text-anchor="middle" fill="#216e62">feature/*</text>
    <rect x="168" y="78" width="150" height="46" rx="10" fill="#fff" stroke="#005ca9" stroke-width="2"/><text class="bx" x="243" y="100" text-anchor="middle">Pull Request</text><text class="cap" x="243" y="115" text-anchor="middle">+ review</text>
    <rect x="348" y="78" width="150" height="46" rx="10" fill="#fff" stroke="#00437a" stroke-width="2"/><text class="bx" x="423" y="106" text-anchor="middle">main / develop</text>
    <rect x="700" y="78" width="130" height="46" rx="10" fill="#127527"/><text class="bx" x="765" y="106" text-anchor="middle" fill="#fff">Produção</text>
  </g>

  <!-- arrows along pipeline -->
  <line x1="138" y1="101" x2="166" y2="101" stroke="#9eb2b8" stroke-width="2.4" marker-end="url(#i-gray)"/>
  <line x1="318" y1="101" x2="346" y2="101" stroke="#9eb2b8" stroke-width="2.4" marker-end="url(#i-gray)"/>
  <line x1="498" y1="101" x2="588" y2="101" stroke="#127527" stroke-width="2.6"/>
  <line x1="640" y1="101" x2="698" y2="101" stroke="#127527" stroke-width="2.6" marker-end="url(#i-green)"/>

  <!-- checkpoint / guard-rail -->
  <line x1="614" y1="40" x2="614" y2="150" stroke="#00437a" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- shield with integrador -->
  <g transform="translate(614,40)">
    <path d="M0 -26 L22 -16 V2 C22 16 12 24 0 30 C-12 24 -22 16 -22 2 V-16 Z" fill="#00437a"/>
    <path d="M-9 1 l6 6 l12 -13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="614" y="92" font-size="12" font-weight="700" fill="#00437a" text-anchor="middle">INTEGRADOR</text>
  <text x="614" y="138" font-size="11" fill="#00437a" text-anchor="middle">guard-rails · aprovação</text>
  <circle cx="640" cy="101" r="11" fill="#e7f4ea" stroke="#127527" stroke-width="1.6"/>
  <path d="M635 101 l4 4 l7 -8" fill="none" stroke="#127527" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- blocked bypass attempt -->
  <path d="M78 124 C78 175,300 175,560 175 C660 175,720 175,760 132" fill="none" stroke="#d93636" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- sobre a curva, à direita do rótulo (que termina em x=638): em 614 o
       símbolo caía em cima da palavra "bloqueada" -->
  <g transform="translate(690,168)">
    <circle r="12" fill="#fbebeb" stroke="#d93636" stroke-width="2"/>
    <path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#d93636" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="320" y="170" font-size="11" font-weight="700" fill="#b22c2c">promoção sem passar pelos guard-rails: bloqueada</text>

  <!-- responsibility cards -->
  <g transform="translate(0,205)">
    <rect x="14"  y="0" width="214" height="116" rx="12" fill="#fff" stroke="#dbe5e8"/>
    <circle cx="44" cy="32" r="16" fill="#e5f2fc"/><path d="M44 24 v16 M36 32 h16" stroke="#005ca9" stroke-width="2.4" stroke-linecap="round"/>
    <text class="ct" x="70" y="30">Governança técnica</text>
    <text class="cd" x="32" y="62">Monitora divergência entre</text>
    <text class="cd" x="32" y="78">branches, rastreabilidade de</text>
    <text class="cd" x="32" y="94">tags e conformidade da CI.</text>

    <rect x="238" y="0" width="214" height="116" rx="12" fill="#fff" stroke="#dbe5e8"/>
    <circle cx="268" cy="32" r="16" fill="#e7f4ea"/><path d="M268 23 l8 4 v6 c0 6 -4 9 -8 11 c-4 -2 -8 -5 -8 -11 v-6 z" fill="#127527"/>
    <text class="ct" x="294" y="30" fill="#0d581d">Guard-rails</text>
    <text class="cd" x="256" y="62">Impede que versões cheguem</text>
    <text class="cd" x="256" y="78">à produção sem conformidade</text>
    <text class="cd" x="256" y="94">com as políticas definidas.</text>

    <rect x="462" y="0" width="214" height="116" rx="12" fill="#fff" stroke="#dbe5e8"/>
    <circle cx="492" cy="32" r="16" fill="#fff0d6"/><path d="M484 36 l6 -10 4 6 4 -8 4 12" fill="none" stroke="#e58500" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="ct" x="518" y="30" fill="#a85f00">Resolução de conflitos</text>
    <text class="cd" x="480" y="62">Orienta merge, rebase, proteção</text>
    <text class="cd" x="480" y="78">e políticas de branches,</text>
    <text class="cd" x="480" y="94">aprovações e conclusão de PRs.</text>

    <rect x="686" y="0" width="214" height="116" rx="12" fill="#fff" stroke="#dbe5e8"/>
    <circle cx="716" cy="32" r="16" fill="#e5f5f8"/><path d="M709 28 h14 v10 h-9 l-4 4 v-4 h-1 z" fill="#038299"/>
    <text class="ct" x="742" y="30" fill="#026273">Disseminação</text>
    <text class="cd" x="704" y="62">Revisa PRs e orienta sobre</text>
    <text class="cd" x="704" y="78">nomenclatura de branches,</text>
    <text class="cd" x="704" y="94">SemVer e ferramentas DevOps.</text>
  </g>
</svg>
