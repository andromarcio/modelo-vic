<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-label="Fluxo de pull request: aprovação por pares e completude pelo integrador">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .bx  { font-size: 13px; font-weight: 700; fill: #22292e; }
    .sub { font-size: 11.5px; fill: #525f66; }
    .cap { font-size: 12px; fill: #525f66; }
    .tag { font-size: 11px; font-weight: 800; letter-spacing:.04em; }
  </style>
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9eb2b8"/></marker>
  </defs>

  <!-- PR aberto -->
  <rect x="20" y="64" width="150" height="56" rx="12" fill="#fff" stroke="#9eb2b8" stroke-width="1.6"/>
  <text class="bx" x="95" y="88" text-anchor="middle">PR aberto</text>
  <text class="sub" x="95" y="106" text-anchor="middle">versão candidata</text>

  <!-- Aprovação -->
  <rect x="222" y="58" width="196" height="68" rx="12" fill="#e5f2fc" stroke="#8fcbff" stroke-width="1.6"/>
  <text class="tag" x="320" y="52" text-anchor="middle" fill="#00538f">MOMENTO 1</text>
  <g transform="translate(244,82)" fill="none" stroke="#005ca9" stroke-width="2"><circle cx="7" cy="-2" r="5"/><path d="M-1 12 a8 8 0 0 1 16 0"/></g>
  <text class="bx" x="330" y="86" text-anchor="middle" fill="#00437a">Aprovação</text>
  <text class="sub" x="330" y="104" text-anchor="middle">revisão por pares (time)</text>

  <!-- Completude -->
  <rect x="470" y="58" width="196" height="68" rx="12" fill="#fff0d6" stroke="#ffd7a3" stroke-width="1.6"/>
  <text class="tag" x="568" y="52" text-anchor="middle" fill="#a85f00">MOMENTO 2</text>
  <path d="M488 78 l7 3 v6 c0 6 -4 9 -7 11 c-3 -2 -7 -5 -7 -11 v-6 z" fill="#e58500"/>
  <text class="bx" x="576" y="86" text-anchor="middle" fill="#a85f00">Completude</text>
  <text class="sub" x="576" y="104" text-anchor="middle">merge pelo Integrador</text>

  <!-- branch permanente -->
  <rect x="718" y="64" width="172" height="56" rx="12" fill="#00437a"/>
  <text class="bx" x="804" y="88" text-anchor="middle" fill="#fff">Branch permanente</text>
  <text x="804" y="106" text-anchor="middle" font-size="11.5" fill="#cfe2f5">main / develop</text>

  <!-- arrows -->
  <line x1="170" y1="92" x2="220" y2="92" stroke="#9eb2b8" stroke-width="2.2" marker-end="url(#ra)"/>
  <line x1="418" y1="92" x2="468" y2="92" stroke="#9eb2b8" stroke-width="2.2" marker-end="url(#ra)"/>
  <line x1="666" y1="92" x2="716" y2="92" stroke="#9eb2b8" stroke-width="2.2" marker-end="url(#ra)"/>

  <text x="460" y="170" class="cap" text-anchor="middle"><tspan font-weight="700" fill="#00437a">Aprovação</tspan> = validação técnica e funcional por revisores do time. <tspan font-weight="700" fill="#a85f00">Completude</tspan> = efetiva o merge — restrita a integradores.</text>
  <text x="460" y="192" class="cap" text-anchor="middle">O histórico de pull requests é mantido como evidência de governança e rastreabilidade.</text>
</svg>
