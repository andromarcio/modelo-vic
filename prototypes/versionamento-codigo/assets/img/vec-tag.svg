<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-label="Padrão VEC: MAJOR.MINOR.PATCH.BUILD">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .num { font-size: 40px; font-weight: 800; fill: #fff; }
    .dot { font-size: 40px; font-weight: 800; fill: #9eb2b8; }
    .lab { font-size: 13px; font-weight: 800; }
    .desc{ font-size: 12.5px; fill: #525f66; }
    .v   { font-size: 34px; font-weight: 800; fill: #00437a; }
  </style>

  <!-- bracket SemVer sobre os 3 primeiros -->
  <path d="M150 44 v-10 h300 v10" fill="none" stroke="#9eb2b8" stroke-width="1.6"/>
  <text class="desc" x="300" y="22" text-anchor="middle" font-weight="700">núcleo SemVer</text>

  <!-- tag prefix -->
  <text class="v" x="120" y="118">v</text>

  <!-- componentes -->
  <rect x="150" y="60" width="84" height="78" rx="16" fill="#00437a"/><text class="num" x="192" y="115" text-anchor="middle">2</text>
  <text class="dot" x="246" y="115" text-anchor="middle">.</text>
  <rect x="262" y="60" width="84" height="78" rx="16" fill="#005ca9"/><text class="num" x="304" y="115" text-anchor="middle">4</text>
  <text class="dot" x="358" y="115" text-anchor="middle">.</text>
  <rect x="374" y="60" width="84" height="78" rx="16" fill="#21caaf"/><text class="num" x="416" y="115" text-anchor="middle">1</text>
  <text class="dot" x="470" y="115" text-anchor="middle">.</text>
  <rect x="486" y="60" width="118" height="78" rx="16" fill="#f39200"/><text class="num" x="545" y="115" text-anchor="middle">305</text>

  <!-- labels -->
  <text class="lab" x="192" y="162" text-anchor="middle" fill="#00437a">MAJOR</text>
  <text class="lab" x="304" y="162" text-anchor="middle" fill="#005ca9">MINOR</text>
  <text class="lab" x="416" y="162" text-anchor="middle" fill="#216e62">PATCH</text>
  <text class="lab" x="545" y="162" text-anchor="middle" fill="#a85f00">BUILD</text>
  <text class="desc" x="545" y="184" text-anchor="middle">identificador de build</text>
  <text class="desc" x="545" y="201" text-anchor="middle">(granularidade da CI)</text>

  <!-- elegibilidade -->
  <g transform="translate(660,70)">
    <rect x="0" y="0" width="232" height="120" rx="14" fill="#e7f4ea" stroke="#9bdaa9"/>
    <circle cx="30" cy="34" r="14" fill="#127527"/><path d="M24 34 l5 5 8 -10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="36" font-size="13.5" font-weight="800" fill="#0d581d">Elegível para produção</text>
    <text x="20" y="74" class="desc">Somente commits com tag no</text>
    <text x="20" y="92" class="desc">formato VEC podem ser</text>
    <text x="20" y="110" class="desc">promovidos para produção.</text>
  </g>
</svg>
