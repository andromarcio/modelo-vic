<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentação</title>

  <!-- Configuração por repositório (nome do projeto). Definida antes do uso. -->
  <script src="assets/js/config.js"></script>

  <!-- Estilos oficiais do Design System da CAIXA localizados no repositório -->
  <link rel="stylesheet" href="prototypes/_biblioteca-caixa/caixa-ds.css">

  <!-- Bibliotecas externas via CDN de alta performance -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- Backdrop para celular colapsar sidebar -->
<div class="dsc-sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){toggleSidebar(false);}" aria-label="Fechar menu"></div>

<div class="dsc-app" id="app">

  <!-- Header full-width -->
  <header class="dsc-header">
    <div class="dsc-header-left">
      <!-- Logo + título da aplicação -->
      <div class="dsc-sidebar-brand" style="border:none; padding:0; margin:0;">
        <span class="dsc-brand-mark">
          <img src="https://www.caixa.gov.br/PublishingImages/nova-home/icones/x-volume-negativa-54.png" alt="CAIXA">
        </span>
        <span id="brandName">Docs</span>
      </div>

      <!-- Botão hambúrguer no mobile -->
      <button class="dsc-btn-sidebar-toggle" onclick="toggleSidebar(true)" title="Menu de diretórios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
    
    <div class="dsc-header-actions">
      <!-- Busca por nome do arquivo e por conteúdo -->
      <div class="dsc-header-search">
        <svg class="dsc-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="dsc-search-input" id="searchInput" placeholder="Pesquisar por nome ou conteúdo..." oninput="handleSearch()">
      </div>

      <!-- Toggle claro / escuro -->
      <button class="dsc-btn-dark-toggle" onclick="toggleTheme()" title="Alternar tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Corpo da aplicação: sidebar + resizer + conteúdo -->
  <div class="dsc-app-body">

    <!-- Sidebar de Navegação -->
    <aside class="dsc-sidebar" id="sidebar">
      <!-- Itens fixos -->
      <div class="dsc-sidebar-fixed">
        <a class="dsc-tree-file" href="#README.md" data-path="README.md" onclick="navigateTo('README.md'); return false;">
          <svg class="dsc-icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>Home</span>
        </a>
        <a class="dsc-tree-file" href="#global/N0_PRODUCT_VISION.md" data-path="global/N0_PRODUCT_VISION.md" onclick="navigateTo('global/N0_PRODUCT_VISION.md'); return false;">
          <svg class="dsc-icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>Visão Geral</span>
        </a>
      </div>

      <!-- Árvore de Diretórios -->
      <nav class="dsc-tree-nav" id="treeNav">
        <!-- Inserido dinamicamente via JS -->
        <div class="dsc-loader">
          <div class="dsc-spinner"></div>
        </div>
      </nav>
    </aside>
    
    <!-- Alça arrastável para redimensionar a sidebar -->
    <div class="dsc-resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Redimensionar menu lateral"></div>

    <!-- Painel de Conteúdo Principal -->
    <div class="dsc-shell-main">
      <!-- Área de Exibição com barra de rolagem dedicada e 100% largura útil -->
      <main class="dsc-main-content-scroll">
        <div class="dsc-viewer-container">
          
          <!-- Breadcrumb do arquivo ativo -->
          <div class="dsc-header-info">
            <ul class="dsc-breadcrumb" id="breadcrumb">
              <li class="dsc-breadcrumb-item">Documentação</li>
            </ul>
          </div>
          
          <!-- Card de Conteúdo principal 100% da tela -->
          <article class="dsc-content-card" id="documentCard">
            <div class="dsc-markdown-body" id="markdownContent">
              <!-- Loader de inicialização -->
              <div class="dsc-empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                  <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <h2 class="dsc-title-sm">Nenhum arquivo selecionado</h2>
                <p class="dsc-body-sm">Utilize o menu lateral para pesquisar e selecionar um arquivo Markdown para ler seu conteúdo.</p>
              </div>
            </div>
          </article>
          
        </div>
      </main>
    </div>

  </div>
</div>

<!-- Árvore de arquivos gerada por assets/generate-tree.js (ou .py) -->
<script src="assets/tree.js"></script>

<script src="assets/js/app.js"></script>

</body>
</html>
